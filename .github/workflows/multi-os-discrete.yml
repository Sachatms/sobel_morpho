name: Multi-OS CI (Discrete Jobs)

on:
  push:
    branches: [ main, workspace_sacha ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libsdl2-dev libsdl2-ttf-dev libcmocka-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_TESTING=ON

    - name: Build project
      run: |
        cd build
        make

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Verify build
      run: |
        if [ -f "build/sobel" ] || [ -f "build/Debug/sobel" ] || [ -f "build/Release/sobel" ]; then
          echo "✅ Ubuntu build successful"
        else
          echo "❌ Ubuntu build failed"
          exit 1
        fi

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build project
      run: |
        cd build
        cmake --build . --config Release

    - name: Verify build
      run: |
        if (Test-Path "build/Release/sobel.exe") {
          Write-Host "✅ Windows build successful"
        } else {
          Write-Host "❌ Windows build failed"
          exit 1
        }
